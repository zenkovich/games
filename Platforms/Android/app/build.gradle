plugins {
    id 'com.android.application'
}

// Per-game identity. Every game is a branch of this repo, so the package name and
// version come from GameInfo.json in the branch root — two games sharing one
// applicationId would replace each other when installed on the same device.
// `namespace` stays fixed: it is the package of the Java sources, not the app id.
def gameInfoFile = file('../../../GameInfo.json')
def gameInfo = gameInfoFile.exists()
        ? new groovy.json.JsonSlurper().parse(gameInfoFile)
        : [:]
// -PgameApplicationId=... etc. let the publish pipeline override without editing
// the branch; GameInfo.json stays the default for plain Studio / gradlew builds.
def gameTitle = project.findProperty('gameTitle') ?: gameInfo.title ?: 'o2 Template'
def gameApplicationId = project.findProperty('gameApplicationId') ?: gameInfo.bundleId ?: 'com.o2.template'
def gameVersionName = project.findProperty('gameVersionName') ?: gameInfo.version ?: '1.0'
def gameVersionCode = (project.findProperty('gameVersionCode') ?: gameInfo.build ?: 1) as int

// Release signing. Without a keystore the release build falls back to the debug
// key, which is fine locally and NOT fine for anything published: debug.keystore
// is in the repo with a known password, so anyone could sign an "update" to your
// app. Copy keystore.properties.example and fill it in to sign for real.
def keystorePropsFile = file('../keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.containsKey('storeFile')

android {
    namespace 'com.o2.template'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId gameApplicationId
        minSdk 24
        targetSdk 35
        versionCode gameVersionCode
        versionName gameVersionName

        manifestPlaceholders = [appLabel: gameTitle]

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-24',
                          '-DO2_EDITOR=OFF',
                          '-DO2_TESTS=OFF'
                targets 'Game'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Points at the root Game/CMakeLists.txt (three levels up from this file).
            path '../../../CMakeLists.txt'
            version '3.22.1+'
        }
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            // R8 strips the appcompat code the game never touches — most of the
            // dex is that library. Keep rules live in proguard-rules.pro; the JNI
            // ones matter, since a renamed native method breaks the link only at
            // runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug

            // AGP configures the native build as RelWithDebInfo, which o2 still treats as a
            // development configuration and leaves the Tracy listener thread running
            externalNativeBuild {
                cmake {
                    arguments '-DO2_TRACY=OFF'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Assets are pre-built by the host (AssetsBuilder) into BuiltAssets/Android.
    // ProjectSettings.json lives at the project root (not inside BuiltAssets) and
    // is staged into a generated-assets dir by the copyProjectSettings task below.
    sourceSets {
        main {
            assets.srcDirs += ['../../../BuiltAssets/Android',
                               "${buildDir}/generated/projectSettingsAssets"]
        }
    }
}

tasks.register('copyProjectSettings', Copy) {
    from "${rootDir}/../../ProjectSettings.json"
    into "${buildDir}/generated/projectSettingsAssets"
}

// Every task that reads the assets source dirs needs the generated file in place first. Lint
// (release only) reads them too and fails validation without an explicit dependency.
tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild'
        || (task.name.startsWith('merge') && task.name.endsWith('Assets'))
        || task.name.toLowerCase().contains('lint')) {
        task.dependsOn 'copyProjectSettings'
    }
}

// androidx.appcompat 1.7 pulls kotlin-stdlib 1.8.22, but AGP ships 1.6.21 for
// kotlin-stdlib-jdk7/jdk8 — D8 then finds duplicate classes. Kotlin 1.8+ merges
// jdk7/jdk8 stubs into kotlin-stdlib itself, so pin the whole family to 1.8.22.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Loud, because a debug-signed APK looks completely normal until someone else
// signs an update to it.
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKeystore && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        logger.warn('WARNING: no Platforms/Android/keystore.properties — the release APK is ' +
                    'signed with the shared DEBUG key and must not be published.')
    }
}
